# Maps IdP attribute values to platform roles (02 §8). Claim names are placeholders
# until the new Shibboleth is specified; here they match dev/keycloak/hka-realm.json.
sources:
  - claim: eduPersonAffiliation
    map: { student: student, employee: employee, faculty: professor, staff: employee }
  - claim: eduPersonEntitlement
    map: { "urn:hka:portal:admin": platform-admin }
default_roles: []
