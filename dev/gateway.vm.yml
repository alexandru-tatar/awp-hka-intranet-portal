# Portal auf der Test-VM iwi-hean-05 (extras/compose/vm): wie gateway.compose.yml, aber hinter nginx mit HTTPS.
# Der Browser erreicht Portal und Keycloak über https://iwi-hean-05.hs-karlsruhe.de (Keycloak unter /auth = issuer);
# der Container holt Discovery, Token und JWKS intern über keycloak:8080/auth (KC_HOSTNAME_BACKCHANNEL_DYNAMIC).
env: dev
auth_mode: oidc
kontakt: "dem IT-Servicedesk (Kontakt folgt)"
# Die Manifeste der Apps legt die Pipeline ab (extras/compose/vm/deploy/README.md), das Portal liest sie nur.
# Der Prober setzt den Status (registry.probe), deshalb gibt es hier keine state.yml.
manifests_dir: /var/lib/portal/manifests
schema_path: ../schemas/manifest.schema.json
kit_dist: ../kit/dist
role_vocabulary: [student, employee, professor, platform-admin, pilot-tester]
adapter_scopes: [noten:read, mail:send]
links: { help: "#", privacy: "#", imprint: "#" }

session_cookie: portal_sid
login_cookie: portal_login
cookie_secure: true

redis_url: redis://redis:6379/0
idle_seconds: 1800
absolute_seconds: 28800
touch_min_interval_seconds: 60
login_state_ttl_seconds: 600

oidc:
  issuer: https://iwi-hean-05.hs-karlsruhe.de/auth/realms/hka
  discovery_url: http://keycloak:8080/auth/realms/hka/.well-known/openid-configuration
  client_id: portal
  client_secret_file: keycloak/portal-client-secret
  redirect_uri: https://iwi-hean-05.hs-karlsruhe.de/oidc/callback
  post_logout_redirect_uri: https://iwi-hean-05.hs-karlsruhe.de/   # IdP-Abmeldung (RP-initiated Logout); Wert muss im Client erlaubt sein
  scopes: [openid, profile, email]
  id_token_algs: [RS256, ES256]
  clock_leeway_seconds: 60

roles_file: roles.yml
grants_file: grants.yml

# Registry (docs/07-registry-und-apps.md): Manifest-Ordner alle 5 s auf Änderungen prüfen und /healthz jeder App prüfen.
# owners_file benutzt nur der Befehl "python -m portal.registry" (über portal-deploy), nicht das Portal.
registry:
  refresh_seconds: 5
  probe: true
  owners_file: /var/lib/portal/registry/owners.json

# Weiterleitung /apps/<slug>/ an den Container "app-<slug>" im selben Docker-Netz (HKA-52); der Prober fragt dort /healthz.
# env dev: Der Signaturschlüssel ist flüchtig und ändert sich bei jedem Start des Portals.
assertion:
  issuer: https://iwi-hean-05.hs-karlsruhe.de/
apps:
  upstream: http://app-{slug}:8080

# Logging (core/log.py): Konsole immer, Logdatei optional. Level je Logger überschreiben die Mindestlevel.
logging:
  console_level: INFO           # TRACE | DEBUG | INFO | SUCCESS | WARNING | ERROR | CRITICAL
  color: auto                   # auto = nur auf einem Terminal; always = auch in docker logs und IDE-Konsolen
  # file: /tmp/hka-portal.log   # Logdatei einschalten (rotiert, ältere Dateien als .gz)
  # file_level: DEBUG
  # rotation: 10 MB
  # retention: 3
  levels:
    uvicorn.access: WARNING       # die Zugriffszeile schreibt portal.web.middleware, mit Request-ID
    httpx: WARNING
    redis: INFO
    httpcore: WARNING
    watchfiles: WARNING
