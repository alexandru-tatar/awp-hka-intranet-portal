# Portal auf der Test-VM iwi-hean-05 (extras/compose/vm) hinter nginx mit HTTPS.
# Login, Sessions und App-Routing liegen im separaten Security-Gateway (eigenes Repo); das Portal prüft nur dessen
# signierte Assertion (auth_mode gateway). Issuer, JWKS-URL und öffentliche URL passend zum Gateway-Deployment setzen.
env: dev
auth_mode: gateway
kontakt: "dem IT-Servicedesk (Kontakt folgt)"
# Die Manifeste der Apps legt die Pipeline ab (extras/compose/vm/deploy/README.md), das Portal liest sie nur.
# Der Prober setzt den Status (registry.probe), deshalb gibt es hier keine state.yml.
manifests_dir: /var/lib/portal/manifests
schema_path: ../schemas/manifest.schema.json
kit_dist: ../kit/dist
role_vocabulary: [student, employee, professor, platform-admin, pilot-tester]
adapter_scopes: [noten:read, mail:send]
links: { help: "#", privacy: "#", imprint: "#" }

session_cookie: portal_sid
cookie_secure: true

# Muss zum Gateway-Deployment passen (security-gateway, Env des Gateway-Containers):
#   issuer     = GW_ASSERTION_ISSUER, ohne Wert GW_PUBLIC_URL + "/"  (gateway/app.py)
#   public_url = GW_PUBLIC_URL, nur Origin ohne Pfad, HTTPS bei GW_COOKIE_SECURE=true
#   jwks_url   = interner Name des Gateway-Containers + Port 8080 + /.well-known/jwks.json;
#                der Hostname muss in GW_INTERNAL_HOSTS des Gateways stehen
#   audience   = GW_PORTAL_AUDIENCE (Standard hka-portal-ui)
# TODO: Containername/Netz auf der VM mit dem Gateway-Deployment abstimmen (hier: Dienstname "gateway").
gateway:
  issuer: https://iwi-hean-05.hs-karlsruhe.de/
  jwks_url: http://gateway:8080/.well-known/jwks.json
  public_url: https://iwi-hean-05.hs-karlsruhe.de
  audience: hka-portal-ui

# Grants im beschreibbaren Registry-Ordner, damit die Verwaltungsseite sie ändern kann. Fehlt die Datei, gibt es keine Grants.
grants_file: /var/lib/portal/registry/grants.yml

# Registry (docs/07-registry-und-apps.md): Manifest-Ordner alle 5 s auf Änderungen prüfen und /healthz jeder App prüfen.
# owners_file lesen portal-deploy und die Verwaltungsseite des Portals.
# status_file schreibt der Prober; "portal-deploy list" liest daraus den Status (HKA-56).
registry:
  refresh_seconds: 5
  probe: true
  owners_file: /var/lib/portal/registry/owners.json
  status_file: /var/lib/portal/status/status.json
  admin_write: true   # Verwaltungsseite /_portal/admin darf Apps entfernen, Rollen und Grants ändern (docs/07); braucht die :rw-Mounts

# Der Prober fragt /healthz des Containers "app-<slug>" im selben Docker-Netz (HKA-52).
apps:
  upstream: http://app-{slug}:8080

# Logging (core/log.py): Konsole immer, Logdatei optional. Level je Logger überschreiben die Mindestlevel.
logging:
  console_level: INFO           # TRACE | DEBUG | INFO | SUCCESS | WARNING | ERROR | CRITICAL
  color: auto                   # auto = nur auf einem Terminal; always = auch in docker logs und IDE-Konsolen
  # file: /tmp/hka-portal.log   # Logdatei einschalten (rotiert, ältere Dateien als .gz)
  # file_level: DEBUG
  # rotation: 10 MB
  # retention: 3
  levels:
    uvicorn.access: WARNING       # die Zugriffszeile schreibt portal.web.middleware, mit Request-ID
    httpx: WARNING
    httpcore: WARNING
    watchfiles: WARNING
