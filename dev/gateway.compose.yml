# Portal im Container (extras/compose/backend) beim lokalen Start über das Security-Gateway (server/compose.yml).
# Kopie von gateway.vm.yml; anders sind nur lokale Adressen (http://localhost:18080), cookie_secure und Logging.
# Login, Sessions und App-Routing liegen im Security-Gateway; das Portal prüft nur dessen Assertion (auth_mode gateway).
env: dev
auth_mode: gateway
kontakt: "dem IT-Servicedesk (Kontakt folgt)"
# Manifeste: Ordner .local/portal/manifests im Portal-Repo (Volume). Der Prober setzt den Status, keine state.yml.
manifests_dir: /var/lib/portal/manifests
schema_path: ../schemas/manifest.schema.json
kit_dist: ../kit/dist
role_vocabulary: [student, employee, professor, platform-admin, pilot-tester]
adapter_scopes: [noten:read, mail:send, bwsync:read, bwsync:write, bwsync:delete]
session_cookie: portal_sid
cookie_secure: false            # lokal nur HTTP auf localhost

# Muss zum Gateway passen (awp-hka-security-gateway/gateway/compose.yml, lokale Standardwerte):
#   issuer     = GW_ASSERTION_ISSUER (Standard GW_PUBLIC_URL + "/")
#   public_url = GW_PUBLIC_URL
#   jwks_url   = Dienst "gateway" im Netz "portal"; "gateway" steht in GW_INTERNAL_HOSTS
#   audience   = GW_PORTAL_AUDIENCE (Standard hka-portal-ui)
gateway:
  issuer: http://localhost:18080/
  jwks_url: http://gateway:8080/.well-known/jwks.json
  public_url: http://localhost:18080
  audience: hka-portal-ui

# Grants im beschreibbaren Registry-Ordner, damit die Verwaltungsseite sie ändern kann. Fehlt die Datei, gibt es keine Grants.
grants_file: /var/lib/portal/registry/grants.yml

# Registry wie auf der VM: Manifest-Ordner alle 5 s prüfen, /healthz jeder App prüfen (Prober), Status in status_file.
registry:
  refresh_seconds: 5
  probe: true
  owners_file: /var/lib/portal/registry/owners.json
  status_file: /var/lib/portal/status/status.json
  admin_write: true   # Verwaltungsseite /_portal/admin darf Apps entfernen, Rollen und Grants ändern; braucht die :rw-Mounts

# Der Prober fragt /healthz des Containers "app-<slug>" im Netz hka-portal-apps.
apps:
  upstream: http://app-{slug}:8080

# Logging (core/log.py): lokal ausführlicher und farbig auch in "docker compose logs".
logging:
  console_level: DEBUG          # TRACE | DEBUG | INFO | SUCCESS | WARNING | ERROR | CRITICAL
  color: always                 # auto = nur auf einem Terminal; always = auch in docker logs und IDE-Konsolen
  # file: /tmp/hka-portal.log   # Logdatei nur unter /tmp (Container ist read_only)
  levels:
    uvicorn.access: WARNING       # die Zugriffszeile schreibt portal.web.middleware, mit Request-ID
    httpx: WARNING
    httpcore: WARNING
    watchfiles: WARNING
