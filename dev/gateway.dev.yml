# Portal UI config for local development. Paths are relative to this file.
env: dev
kontakt: "dem IT-Servicedesk (Kontakt folgt)"   # open item 04 §13 — HKA-IT to supply
kontakt_en: "the IT service desk (contact details to follow)"
manifests_dir: manifests
state_file: state.yml
dev_users_file: users.yml
schema_path: ../schemas/manifest.schema.json
kit_dist: ../kit/dist
session_cookie: portal_sid
role_vocabulary: [student, employee, professor, platform-admin, maintainer, pilot-tester]   # = roles.yml + grants.yml (02 §8)
adapter_scopes: [noten:read, mail:send]                                         # later: x-required-scope from adapter OpenAPI (05)
# Logging (core/log.py): Konsole immer, Logdatei optional. Level je Logger überschreiben die Mindestlevel.
logging:
  console_level: DEBUG          # TRACE | DEBUG | INFO | SUCCESS | WARNING | ERROR | CRITICAL
  color: always                 # auto = nur auf einem Terminal; always = auch in docker logs und IDE-Konsolen
  # file: /tmp/hka-portal.log   # Logdatei einschalten (rotiert, ältere Dateien als .gz)
  # file_level: DEBUG
  # rotation: 10 MB
  # retention: 3
  levels:
    uvicorn.access: WARNING       # die Zugriffszeile schreibt portal.web.middleware, mit Request-ID
    httpx: WARNING
    httpcore: WARNING
    watchfiles: WARNING

# Verwaltungsseite /_portal/admin (nur platform-admin): darf Manifeste im Ordner manifests/ löschen und ändern.
# owners.json und retired.json entstehen dabei neben dieser Datei (in .gitignore); "git restore dev/manifests" stellt zurück.
registry:
  owners_file: owners.json
  admin_write: true

# Dokumentation /_portal/docs (docs/06-oberflaeche.md): lesen alle Angemeldeten, bearbeiten Rolle maintainer und
# Personen, die die Verwaltungsseite als Maintainer freigibt.
# Seiten, Versionen und hochgeladene Bilder liegen in docs/ neben dieser Datei (in .gitignore); ein leerer Ordner bekommt
# beim Start den Ausgangsstand aus src/portal/docs/seed.html. Zurücksetzen: Ordner dev/docs löschen.
docs:
  dir: docs
  read_roles: all
  edit_roles: [maintainer]
  max_upload_mb: 10
