[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hka-portal"
version = "0.1.0"
description = "HKA Portal: Gateway, Registry und Portal-UI"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "Jinja2==3.1.6",
    "PyYAML==6.0.3",
    "jsonschema==4.26.0",
    "python-multipart==0.0.32",
    "loguru>=0.7.3",
    "redis>=8.1.0",
    "pyjwt[crypto]>=2.15.1",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "fakeredis>=2.40.0",
    "httpx2>=2.16.0",
]
doc = [
    "sphinx>=9.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
portal = ["templates/**/*.html", "locales/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
