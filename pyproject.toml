[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hka-portal"
version = "0.1.0"
description = "HKA Portal: Gateway, Registry und Portal-UI"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "Jinja2==3.1.6",
    "PyYAML==6.0.3",
    "jsonschema==4.26.0",
    "python-multipart==0.0.32",
    "loguru>=0.7.3",
    "pyjwt[crypto]>=2.15.1",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx2>=2.16.0",
]
doc = [
    "sphinx>=9.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
portal = ["templates/**/*.html", "locales/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Ruff läuft in der Pipeline (.github/workflows/pruefung.yml) als: uvx ruff@<Version> check src tests sdk/python
# Nur Fehler, die Code kaputt machen oder verbergen (Syntax, Importe, ungenutzte Namen). Stilregeln sind nicht Teil der Prüfung.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
