# Keycloak als IdP für dev (Realm "hka", Benutzer = Passwort: alexandru, antonio, david, neumann, max, admin, gast).
# Aufruf: docker compose up --build   (im Verzeichnis extras/compose/keycloak)
# Konsole: http://localhost:8180 (admin / admin)
#
# KC_HOSTNAME legt den issuer fest, den der Browser sieht. Mit KC_HOSTNAME_BACKCHANNEL_DYNAMIC
# liefert Keycloak Token- und JWKS-URLs passend zum Host der Anfrage: der Browser nutzt
# localhost:8180, das Portal im Compose-Netz keycloak:8080.
name: hka-portal-keycloak

services:
  keycloak:
    build:
      context: ../../..
      dockerfile: extras/compose/keycloak/Dockerfile
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "127.0.0.1:8180:8080"
