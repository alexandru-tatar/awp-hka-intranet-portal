# nginx auf der Test-VM: /etc/nginx/sites-available/portal (aktiv per Symlink in sites-enabled).
# Portal unter /, Keycloak unter /auth/. Die Keycloak-Konsole (/auth/admin/) ist von außen gesperrt;
# Zugriff nur per SSH-Tunnel: ssh -L 8180:127.0.0.1:8180 sadmin@iwi-hean-05.hs-karlsruhe.de
# Prüfen und laden: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name iwi-hean-05.hs-karlsruhe.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name iwi-hean-05.hs-karlsruhe.de;

    ssl_certificate     /etc/ssl/portal/cert.pem;
    ssl_certificate_key /etc/ssl/portal/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  443;

    location /auth/admin/ {
        return 403;
    }

    location /auth/ {
        proxy_pass        http://127.0.0.1:8180;
        proxy_buffer_size 128k;
        proxy_buffers     4 256k;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
