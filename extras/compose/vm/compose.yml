# Test-VM iwi-hean-05: nur noch Keycloak (IdP) hinter nginx (nginx-portal.conf, /auth/).
# Portal, Security-Gateway und Gateway-Redis laufen im Projekt security-gateway/compose.vm.yml; sie nutzen das Netz
# dieses Projekts (hka-portal-vm_default) als externes Netz "identity", um Keycloak zu erreichen.
# Die VM erreicht keine Registry. Images deshalb auf dem Mac bauen und übertragen:
#
#   Mac:  docker compose -f extras/compose/vm/compose.yml build
#         docker save hka/portal-keycloak:0.1.0 | gzip > ~/Downloads/portal-vm.tar.gz
#         scp ~/Downloads/portal-vm.tar.gz extras/compose/vm/compose.yml sadmin@iwi-hean-05.hs-karlsruhe.de:~
#   VM:   gunzip -c ~/portal-vm.tar.gz | sudo docker load
#         sudo docker compose -f ~/compose.yml up -d --no-build
#
# Alle Ports nur an 127.0.0.1; von außen erreichbar ist nur nginx (80/443).
# Keycloak läuft im Dev-Modus mit bekannten Test-Passwörtern (hka-realm.json): nur für Tests mit Testdaten.
name: hka-portal-vm

services:
  keycloak:
    image: hka/portal-keycloak:0.1.0
    platform: linux/amd64
    build:
      context: ../../..
      dockerfile: extras/compose/keycloak/Dockerfile
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8080"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: https://iwi-hean-05.hs-karlsruhe.de/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "127.0.0.1:8180:8080"
    restart: unless-stopped

