<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ tx.dev_login_title }} – {{ app }}</title>
  <link rel="stylesheet" href="/__dev/kit/kit.css">
</head>
<body>
  <div class="dev-banner">{{ tx.dev_login_banner }}</div>
  <main id="main" class="main prose">
    <h1>{{ tx.dev_login_title }}</h1>
    <p class="lead">{{ tx.dev_login_lead }}</p>
    <form method="post" action="/__dev/login">
      <fieldset class="field">
        <legend>{{ tx.dev_login_person }}</legend>
        {% for p in persons %}
        <div><input type="radio" id="sub-{{ p.sub }}" name="sub" value="{{ p.sub }}"{% if loop.first %} checked{% endif %}>
          <label for="sub-{{ p.sub }}">{{ p.name }} ({{ p.hint }})</label></div>
        {% endfor %}
      </fieldset>
      <fieldset class="field">
        <legend>{{ tx.dev_login_roles }}</legend>
        {% for r in roles %}
        <div><input type="checkbox" id="role-{{ r }}" name="roles" value="{{ r }}" checked>
          <label for="role-{{ r }}">{{ r }}</label></div>
        {% endfor %}
      </fieldset>
      <div class="field">
        <label for="extra_roles">{{ tx.dev_login_extra }}</label>
        <p id="extra_roles-hint" class="field__hint">{{ tx.dev_login_extra_hint }}</p>
        <input id="extra_roles" name="extra_roles" type="text" aria-describedby="extra_roles-hint">
      </div>
      <div class="actions"><button type="submit" class="btn btn--primary">{{ tx.dev_login_submit }}</button></div>
    </form>
  </main>
</body>
</html>
