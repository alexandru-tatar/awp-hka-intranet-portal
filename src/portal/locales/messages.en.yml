error.429.body: You sent a lot of requests in a short time. Please wait a moment and try again.
error.501.title: This function does not exist yet
error.501.body: The portal cannot answer this request. Please contact {kontakt}.
error.502.title: Application not reachable
error.502.body: The portal did not get a usable answer from the application. Please try again in a few minutes. If it takes longer, contact {kontakt}.
error.504.title: The answer takes too long
error.504.body: The application did not answer in time. Please try again in a few minutes. If it takes longer, contact {kontakt}.
error.4xx.title: The request was not possible
error.4xx.body: The portal could not process this request. Please try again. If it fails again, contact {kontakt}.
