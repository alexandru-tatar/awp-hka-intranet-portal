header.new_app: New app
neue_app.title: Create a new app
neue_app.eyebrow: Self-service
neue_app.intro: Here you create the repository for your app. It is made from the template, has the branches main and develop and is ready to start at once. You need no commands and no special rights on GitHub.
neue_app.form.slug: Short name
neue_app.form.slug_hint: "It later appears in the address of the app. Allowed are 3 to 31 characters: lowercase letters, digits and hyphens only, and it starts with a letter. For example leave-request. The repository is then called app-leave-request, so do not type “app-” in front yourself."
neue_app.form.language: Template
neue_app.form.language_hint: Both templates come with a dev container and an automatic check. Choose the language your team knows.
neue_app.form.python: Python
neue_app.form.python_meta: FastAPI and uv
neue_app.form.js: JavaScript
neue_app.form.js_meta: Express and npm
neue_app.form.github_login: Your GitHub name
neue_app.form.github_login_hint: The invitation to the repository goes to this name. You find it in your profile on github.com.
neue_app.form.submit: Create app
neue_app.form.submit_hint: Creating the app usually takes 10 to 20 seconds.
neue_app.panel.title: What you get
neue_app.panel.repo: Your own repository on GitHub, copied from the template
neue_app.panel.branches: The branches main and develop
neue_app.panel.protect: "Protection for main: changes only through a pull request"
neue_app.panel.invite: An invitation to your GitHub name
neue_app.busy.eyebrow: One moment please
neue_app.busy.title: Your app is being created
neue_app.busy.body: The portal is now creating your repository on GitHub. This usually takes 10 to 20 seconds. Please do not close this page.
neue_app.busy.steps: Progress
neue_app.busy.note: The page changes by itself as soon as everything is done.
neue_app.error.title: The app was not created
neue_app.error.slug_form: "The short name has 3 to 31 characters: lowercase letters, digits and hyphens only, and it starts with a letter."
neue_app.error.slug_reserved: You may not use this short name. Choose a name that says what your app is about.
neue_app.error.language: Choose Python or JavaScript.
neue_app.error.github_login: This is not a GitHub name. It consists of letters, digits and single hyphens and has at most 39 characters.
neue_app.error.slug_taken: The short name is already taken or blocked. Choose another one. Nothing was created.
neue_app.error.failed_before: "Something went wrong at the step “{step}”. Nothing was created. Try again or contact {kontakt}. Give the number {request_id}."
neue_app.error.failed_after: "The repository “{repo}” was created, but something went wrong at the step “{step}”. Nothing was deleted. Contact {kontakt} and give the number {request_id}."
