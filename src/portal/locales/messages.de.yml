admin.title: Verwaltung
admin.intro: Hier sehen Sie alle Anwendungen im Portal. Sie können Rollen einer Anwendung ändern, Anwendungen entfernen und Personen zusätzliche Rollen geben.
admin.read_only: Die Verwaltung ist hier nur lesend eingerichtet. Änderungen sind nicht möglich.
admin.notice.app_removed: Die Anwendung wurde entfernt. Sie ist nicht mehr im Menü.
admin.notice.app_roles: Die Rollen der Anwendung wurden gespeichert. Das Menü zeigt sie sofort.
admin.notice.grant_set: Die zusätzlichen Rollen wurden gespeichert. Sie gelten ab der nächsten Anmeldung der Person.
admin.notice.grant_deleted: Die zusätzlichen Rollen wurden gelöscht. Das gilt ab der nächsten Anmeldung der Person.
admin.error.title: Ihre Eingabe konnte nicht gespeichert werden
admin.error.app_roles_empty: Wählen Sie mindestens eine Rolle. Eine Anwendung ohne Rolle sieht niemand.
