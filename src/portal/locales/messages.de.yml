neue_app.done.eyebrow: Fertig
neue_app.done.title: Ihre App ist angelegt
neue_app.done.next_title: So geht es weiter
neue_app.done.body: "Das Repository „{repo}“ ist fertig. Es hat die Zweige main und develop. Der Zweig main ist geschützt: Änderungen kommen nur über einen Pull Request mit einer Freigabe."
neue_app.done.invite: Die Einladung ist an „{login}“ gegangen. Nehmen Sie sie auf GitHub an, dann können Sie das Repository klonen.
neue_app.done.open: Repository auf GitHub öffnen
neue_app.done.next: Wie es weitergeht, steht in der Anleitung unter „Arbeitsplatz öffnen“.
