{% extends "base.html" %}
{% block content %}
<h1>{{ t('logout.title') }}</h1>
<p>{{ t('logout.body') }}</p>
<form method="post" action="/logout" class="actions">
  <input type="hidden" name="csrf" value="{{ user.csrf }}">
  <a class="btn btn--secondary" href="/">{{ t('dialog.cancel') }}</a>
  <button type="submit" class="btn btn--primary">{{ t('header.logout') }}</button>
</form>
{% endblock %}
